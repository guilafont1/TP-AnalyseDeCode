# SonarCloud / SonarQube — TP Analyse de code (Shuttle)
sonar.projectKey=tp-analyse-shuttle
sonar.projectName=TP-Analyse de code
sonar.projectVersion=1.0

# SonarCloud : définir sonar.host.url=https://sonarcloud.io et sonar.organization
# Analyse locale : sonar.host.url=http://localhost:9000 (sans organization)
# sonar.organization=guilafont1
# sonar.host.url=https://sonarcloud.io

# Sources principales (module app + librairies internes)
sonar.sources=app/src/main/java,libraries,app/src/main/res
sonar.sourceEncoding=UTF-8

# Exclusions (généré, tests instrumentés, ressources traduites volumineuses)
# **/*.java exclu tant que sonar.java.binaries n'est pas fourni (build Gradle + Android SDK)
sonar.exclusions=**/build/**,**/generated/**,**/R.java,**/BuildConfig.java,**/test/**,**/androidTest/**,**/values-*/**,**/*Test.java,**/*Test.kt,**/*.java

# Android : binaires optionnels si le build Gradle échoue (analyse source seule)
# sonar.java.binaries=app/build/intermediates/javac
